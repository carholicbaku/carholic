<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carpet League Kupası – 360° 3D Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0807;
    --ink:#efe5d0;
    --dim:#a89c86;
    --gold:#d4aa4f;
    --gold-soft:rgba(212,170,79,.32);
    --red:#a3262a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font-family:'Jost','Segoe UI',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
  #stage.drag{cursor:grabbing}

  .brand{position:fixed;top:max(22px,env(safe-area-inset-top));left:26px;display:flex;gap:14px;align-items:center;pointer-events:none}
  .brand svg{width:44px;height:44px;flex:none}
  .brand h1{margin:0;font-weight:400;font-size:22px;letter-spacing:.2em;line-height:1.1;color:var(--gold)}
  .brand p{margin:5px 0 0;font-size:11.5px;letter-spacing:.16em;color:var(--dim);font-weight:300}

  .specs{position:fixed;top:max(24px,env(safe-area-inset-top));right:26px;margin:0;text-align:right;
    font-size:13px;line-height:1.75;font-weight:300;color:var(--dim);pointer-events:none}
  .specs b{font-weight:400;color:var(--ink)}

  .hint{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);margin:0;font-size:14px;font-weight:300;
    color:var(--ink);background:rgba(10,8,7,.72);border:1px solid var(--gold-soft);padding:9px 18px;border-radius:2px;
    pointer-events:none;transition:opacity .9s ease;text-align:center;max-width:88vw}
  .hint.gone{opacity:0}

  .dock{position:fixed;left:0;right:0;bottom:0;padding:16px 26px max(18px,env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(10,8,7,.94) 55%,rgba(10,8,7,0));
    display:grid;gap:14px}
  .angle{display:flex;align-items:center;gap:16px;max-width:760px;width:100%;margin:0 auto}
  .angle label{font-size:13px;color:var(--dim);font-weight:300;white-space:nowrap}
  .angle output{font-size:15px;min-width:3.4ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:400}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--gold-soft)}
  input[type=range]::-moz-range-track{height:1px;background:var(--gold-soft)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-8px;border-radius:50%;
    background:var(--gold);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--gold)}
  input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--gold);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--gold)}

  .views{display:flex;gap:4px 22px;justify-content:center;flex-wrap:wrap}
  .views button,.tools button{font:inherit;font-size:14px;font-weight:400;color:var(--dim);background:none;border:0;
    padding:7px 2px;cursor:pointer;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
  .views button:hover,.tools button:hover{color:var(--ink)}
  .views button.on,.tools button[aria-pressed=true]{color:var(--gold);border-bottom-color:var(--gold)}
  .tools{display:flex;gap:26px;justify-content:center}
  button:focus-visible,input:focus-visible,#stage:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  #loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9;transition:opacity .8s ease}
  #loader.done{opacity:0;pointer-events:none}
  #loader div{text-align:center;font-weight:300;color:var(--dim);font-size:15px}
  #loader svg{width:60px;height:60px;margin-bottom:18px;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){#loader svg{animation:none}.hint{transition:none}}

  @media (max-width:720px){
    .brand{left:16px}.brand h1{font-size:17px}.brand svg{width:34px;height:34px}.brand p{font-size:10px}
    .specs{display:none}
    .dock{padding-left:14px;padding-right:14px}
    .views{gap:2px 14px}
    .views button,.tools button{font-size:13px}
    .hint{bottom:182px;font-size:13px}
  }
</style>
</head>
<body>

<canvas id="stage" tabindex="0" aria-label="Carpet League kupası 3D modeli. Fare veya parmakla sürükleyerek döndürün, ok tuşlarıyla da çevirebilirsiniz."></canvas>

<header class="brand">
  <svg viewBox="0 0 64 64" fill="none" stroke="#d4aa4f" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">
    <path d="M32 4 L60 32 L32 60 L4 32 Z"/>
    <path d="M32 13 L51 32 L32 51 L13 32 Z"/>
    <path d="M32 24 L40 32 L32 40 L24 32 Z" fill="#d4aa4f"/>
    <path d="M32 4v9M60 32h-9M32 60v-9M4 32h9"/>
  </svg>
  <div>
    <h1>CARPET LEAGUE</h1>
    <p>DISTLAR ARASI FUTBOL LIQASI</p>
  </div>
</header>

<dl class="specs" style="margin:0">
  <div>Yükseklik <b>≈ 45 cm</b></div>
  <div>Taban genişliği <b>≈ 14 cm</b></div>
  <div>Halı dokuma gövde, altın şerit, siyah mermer taban</div>
</dl>

<p class="hint" id="hint">Kupayı sürükleyerek döndürün. Tekerlek ya da iki parmakla yakınlaştırın.</p>

<section class="dock" aria-label="Görünüm denetimleri">
  <div class="angle">
    <label for="angle">Dönüş açısı</label>
    <input id="angle" type="range" min="0" max="360" step="1" value="0">
    <output id="angleOut" for="angle">0°</output>
  </div>
  <div class="views" id="views" role="group" aria-label="Hazır görünümler"></div>
  <div class="tools">
    <button id="autoBtn" aria-pressed="true">Otomatik dönüş</button>
    <button id="wireBtn" aria-pressed="false">Tel kafes</button>
  </div>
</section>

<div id="loader" role="status">
  <div>
    <svg viewBox="0 0 64 64" fill="none" stroke="#d4aa4f" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">
      <path d="M32 4 L60 32 L32 60 L4 32 Z"/><path d="M32 13 L51 32 L32 51 L13 32 Z"/><path d="M32 24 L40 32 L32 40 L24 32 Z" fill="#d4aa4f"/>
    </svg>
    <span id="loadMsg">Kupa hazırlanıyor…</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- yardımcılar ---------- */
const TAU = Math.PI*2;
const V3 = THREE.Vector3;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
let seed=20260;
const rand=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;
const $=s=>document.querySelector(s);
const tick=()=>new Promise(r=>setTimeout(r,16));

const GOLD=0xd6a94a;

/* ---------- doku üreticileri ---------- */

// Halı dokuması: düğüm düğüm işlenmiş geleneksel desen
function makeCarpetTextures(){
  const N=48, C=20, S=N*C;
  const col=document.createElement('canvas'); col.width=col.height=S;
  const bmp=document.createElement('canvas'); bmp.width=bmp.height=S;
  const g=col.getContext('2d'), b=bmp.getContext('2d');
  const P={cream:[228,206,168], red:[158,30,36], red2:[190,52,46], navy:[20,24,46], navy2:[38,42,68]};
  function pick(cx,cy){
    const T=24;
    const lx=(cx%T)-11.5, ly=(cy%T)-11.5;
    const d=Math.abs(lx)+Math.abs(ly);
    if(d<2) return P.cream;
    if(d<4) return P.red;
    if(d<6) return P.navy;
    if(d<8) return ((cx+cy)%2)?P.red2:P.cream;
    if(d<10) return P.red;
    if(d<12) return P.navy;
    if(d<13) return P.cream;
    if(d>=21) return P.cream;
    if(d>=19) return P.red;
    if(d>=17) return P.navy;
    return ((cx+cy)%4===0)?P.red:(((cx*3+cy)%7===0)?P.cream:P.navy2);
  }
  b.fillStyle='#808080'; b.fillRect(0,0,S,S);
  for(let cy=0;cy<N;cy++)for(let cx=0;cx<N;cx++){
    const c=pick(cx,cy), j=.88+rand()*.22, x=cx*C, y=cy*C;
    g.fillStyle=`rgb(${c[0]*j|0},${c[1]*j|0},${c[2]*j|0})`; g.fillRect(x,y,C,C);
    g.fillStyle='rgba(255,240,210,.10)'; g.fillRect(x+3,y+3,C-8,3);
    g.fillStyle='rgba(0,0,0,.30)'; g.fillRect(x,y+C-3,C,3); g.fillRect(x+C-2,y,2,C);
    const h=150+rand()*50|0;
    b.fillStyle=`rgb(${h},${h},${h})`; b.fillRect(x+1,y+1,C-2,C-2);
    b.fillStyle='rgba(255,255,255,.35)'; b.fillRect(x+3,y+3,C-8,4);
    b.fillStyle='rgba(0,0,0,.6)'; b.fillRect(x,y+C-4,C,4); b.fillRect(x+C-3,y,3,C);
  }
  // yün lifleri
  for(let i=0;i<9000;i++){
    const x=rand()*S,y=rand()*S,l=3+rand()*5,a=rand()*TAU;
    g.strokeStyle=rand()<.5?'rgba(255,235,200,.07)':'rgba(0,0,0,.10)';
    g.lineWidth=1; g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke();
  }
  return {col,bmp};
}

function drawMarble(g,w,h,veins){
  const gr=g.createLinearGradient(0,0,w,h);
  gr.addColorStop(0,'#0f0f11'); gr.addColorStop(.5,'#171618'); gr.addColorStop(1,'#0b0b0c');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  for(let i=0;i<veins;i++){
    let x=rand()*w,y=rand()*h,ang=rand()*TAU;
    const gold=rand()<.3, steps=20+rand()*40|0;
    g.beginPath(); g.moveTo(x,y);
    for(let s=0;s<steps;s++){ang+=(rand()-.5)*.9;const l=8+rand()*22;x+=Math.cos(ang)*l;y+=Math.sin(ang)*l;g.lineTo(x,y);}
    g.lineWidth=.4+rand()*1.6;
    g.strokeStyle=gold?`rgba(214,170,80,${.12+rand()*.22})`:`rgba(210,210,218,${.05+rand()*.15})`;
    g.stroke();
  }
}

function drawEmblem(g,cx,cy,s,color,lw){
  g.strokeStyle=color; g.fillStyle=color; g.lineWidth=lw; g.lineJoin='round';
  for(const k of [1,.74,.48]){
    g.beginPath(); g.moveTo(cx,cy-s*k); g.lineTo(cx+s*k,cy); g.lineTo(cx,cy+s*k); g.lineTo(cx-s*k,cy); g.closePath(); g.stroke();
  }
  const m=s*.2; g.beginPath(); g.moveTo(cx,cy-m); g.lineTo(cx+m,cy); g.lineTo(cx,cy+m); g.lineTo(cx-m,cy); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(cx,cy-s*1.18); g.lineTo(cx,cy-s); g.moveTo(cx,cy+s*1.18); g.lineTo(cx,cy+s);
  g.moveTo(cx-s*1.18,cy); g.lineTo(cx-s,cy); g.moveTo(cx+s*1.18,cy); g.lineTo(cx+s,cy); g.stroke();
}

// Siyah mermer taban: 8 yüz, ilk yüz ön yüz (logo + yazı)
function makeBaseTexture(){
  const PW=480, PH=640;
  const c=document.createElement('canvas'); c.width=PW*8; c.height=PH;
  const g=c.getContext('2d');
  drawMarble(g,c.width,PH,280);
  const gold='rgba(218,176,84,.95)';
  for(let p=0;p<8;p++){
    const x0=p*PW, cx=x0+PW/2;
    g.strokeStyle=gold; g.lineWidth=5; g.strokeRect(x0+22,22,PW-44,PH-44);
    g.lineWidth=1.5; g.strokeRect(x0+36,36,PW-72,PH-72);
    if(p===0){
      drawEmblem(g,cx,205,64,gold,4);
      g.fillStyle='#dcb55a'; g.textAlign='center'; g.textBaseline='alphabetic';
      const ls=v=>{ if('letterSpacing' in g) g.letterSpacing=v; };
      g.font='500 37px Jost,"Segoe UI",Arial,sans-serif'; ls('4px');
      g.fillText('CARPET LEAGUE',cx+2,372);
      g.fillStyle=gold; g.fillRect(cx-70,402,140,2);
      g.font='400 23px Jost,"Segoe UI",Arial,sans-serif'; ls('3px'); g.fillStyle='#dcb55a';
      g.fillText('DISTLAR ARASI',cx+1,450);
      g.fillText('FUTBOL LIQASI',cx+1,486);
      ls('0px');
    } else {
      const a=(p===1||p===7)?1:.55;
      g.globalAlpha=a; g.strokeStyle=gold; g.lineWidth=4;
      g.beginPath(); g.moveTo(cx,60); g.lineTo(cx,PH-60); g.stroke();
      for(let y=120;y<PH-90;y+=96){
        const h=34;
        g.fillStyle='#0d0d0f';
        g.beginPath(); g.moveTo(cx,y-h); g.lineTo(cx+h,y); g.lineTo(cx,y+h); g.lineTo(cx-h,y); g.closePath(); g.fill(); g.stroke();
        const m=14; g.fillStyle=gold;
        g.beginPath(); g.moveTo(cx,y-m); g.lineTo(cx+m,y); g.lineTo(cx,y+m); g.lineTo(cx-m,y); g.closePath(); g.fill();
        g.lineWidth=2;
        g.beginPath(); g.moveTo(cx-h-26,y); g.lineTo(cx-h-6,y); g.moveTo(cx+h+6,y); g.lineTo(cx+h+26,y); g.stroke();
        g.lineWidth=4;
      }
      g.globalAlpha=1;
    }
  }
  return c;
}

// Futbol topu: kesik ikosahedron (12 beşgen + 20 altıgen) desenini piksel piksel hesapla
function makeBallTexture(){
  const W=2048, H=1024;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  const img=g.createImageData(W,H), d=img.data;
  const phi=(1+Math.sqrt(5))/2;
  const raw=[];
  for(const a of [-1,1]) for(const b of [-phi,phi]) raw.push([0,a,b],[a,b,0],[b,0,a]);
  const nrm=v=>{const l=Math.hypot(v[0],v[1],v[2]);return [v[0]/l,v[1]/l,v[2]/l]};
  const V=raw.map(nrm);
  const F=[];
  for(let i=0;i<12;i++)for(let j=i+1;j<12;j++)for(let k=j+1;k<12;k++){
    const e=(p,q)=>{const s=(raw[p][0]-raw[q][0])**2+(raw[p][1]-raw[q][1])**2+(raw[p][2]-raw[q][2])**2;return Math.abs(s-4)<1e-6};
    if(e(i,j)&&e(j,k)&&e(i,k)) F.push(nrm([V[i][0]+V[j][0]+V[k][0],V[i][1]+V[j][1]+V[k][1],V[i][2]+V[j][2]+V[k][2]]));
  }
  const ang=0.2873, sa=Math.sin(ang), ca=Math.cos(ang);
  const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const N=[], E1=[], E2=[];
  for(const v of V){
    const ns=[]; let e1=null;
    for(const f of F){
      if(dot(f,v)>.7){
        const t=dot(f,v);
        const e=nrm([f[0]-v[0]*t,f[1]-v[1]*t,f[2]-v[2]*t]);
        if(!e1) e1=e;
        ns.push([v[0]*sa-e[0]*ca,v[1]*sa-e[1]*ca,v[2]*sa-e[2]*ca]);
      }
    }
    N.push(ns); E1.push(e1);
    E2.push([v[1]*e1[2]-v[2]*e1[1], v[2]*e1[0]-v[0]*e1[2], v[0]*e1[1]-v[1]*e1[0]]);
  }
  const GOLDC=[218,172,76], PENT=[16,13,11], SEAM=[34,24,10], EMB=[205,162,70];
  for(let y=0;y<H;y++){
    const th=(y+.5)/H*Math.PI, st=Math.sin(th), ct=Math.cos(th);
    for(let x=0;x<W;x++){
      const ph=(x+.5)/W*TAU;
      const p=[-Math.cos(ph)*st, ct, Math.sin(ph)*st];
      let best=-2, bi=0;
      for(let k=0;k<12;k++){const dd=dot(p,V[k]); if(dd>best){best=dd;bi=k;}}
      let dp=9; for(const n of N[bi]){const t=dot(p,n); if(t<dp)dp=t;}
      let base, dist;
      if(dp>0){
        base=PENT; dist=dp;
        const qx=dot(p,E1[bi])/sa, qy=dot(p,E2[bi])/sa, s=Math.abs(qx)+Math.abs(qy);
        if(s<.18||Math.abs(s-.62)<.055||Math.abs(s-.4)<.025) base=EMB;
      } else {
        let d1=-2,d2=-2;
        for(let k=0;k<20;k++){const dd=dot(p,F[k]); if(dd>d1){d2=d1;d1=dd;}else if(dd>d2){d2=dd;}}
        dist=Math.min(-dp,(d1-d2)*1.1);
        const br=.9+.1*Math.sin(p[0]*5+p[1]*3)*Math.cos(p[2]*4);
        base=[GOLDC[0]*br,GOLDC[1]*br,GOLDC[2]*br];
      }
      const t=1-smooth(.008,.026,dist);
      const o=(y*W+x)*4;
      d[o]=base[0]+(SEAM[0]-base[0])*t; d[o+1]=base[1]+(SEAM[1]-base[1])*t; d[o+2]=base[2]+(SEAM[2]-base[2])*t; d[o+3]=255;
    }
  }
  g.putImageData(img,0,0);
  return {canvas:c, vertex:new V3(...V[0])};
}

/* ---------- model ---------- */
const Y0=9.7, Y1=35.5, TILT_PHI=Math.PI*.3;
function radiusAt(h){
  if(h<.5){const s=h/.5;return 2.25+2.05*Math.pow(1-s,2.2);}
  const s=(h-.5)/.5; return 2.25+3.85*Math.pow(s,2);
}
function bodyP(a,h,off){
  off=off||0;
  const t=smooth(.72,1,h);
  let r=(radiusAt(h)+off)*(1+t*.035*Math.sin(a*3+1));
  const y=Y0+h*(Y1-Y0)+Math.pow(t,1.4)*1.8*Math.cos(a-TILT_PHI);
  return new V3(r*Math.sin(a),y,r*Math.cos(a));
}

function buildBody(mat){
  const SEG=192, ROW=120, pos=[], uv=[], idx=[];
  for(let j=0;j<=ROW;j++){
    const h=j/ROW;
    for(let i=0;i<=SEG;i++){
      const a=i/SEG*TAU, p=bodyP(a,h);
      pos.push(p.x,p.y,p.z);
      uv.push(i/SEG + h*.35, h);
    }
  }
  for(let j=0;j<ROW;j++)for(let i=0;i<SEG;i++){
    const a=j*(SEG+1)+i, b=a+1, c=a+SEG+1, d=c+1;
    idx.push(a,b,c, b,d,c);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  geo.setIndex(idx); geo.computeVertexNormals();
  const n=geo.attributes.normal;
  for(let j=0;j<=ROW;j++){
    const a=j*(SEG+1), b=a+SEG;
    const x=(n.getX(a)+n.getX(b))/2, y=(n.getY(a)+n.getY(b))/2, z=(n.getZ(a)+n.getZ(b))/2;
    n.setXYZ(a,x,y,z); n.setXYZ(b,x,y,z);
  }
  return new THREE.Mesh(geo,mat);
}

function buildRibbon(mat){
  const n=360, turns=.88, pos=[], idx=[];
  const A0=-1.5;
  const pts=[], nors=[];
  const at=t=>{
    const a=A0+t*TAU*turns, h=.965-t*.86;
    return {a, p:bodyP(a,h,.14)};
  };
  for(let i=0;i<=n;i++){
    const t=i/n, c=at(t), c2=at(Math.min(1,t+.002)), c0=at(Math.max(0,t-.002));
    const T=c2.p.clone().sub(c0.p).normalize();
    const O=new V3(Math.sin(c.a),0,Math.cos(c.a));
    const W=new V3().crossVectors(T,O).normalize();
    const w=(.08+1.05*Math.pow(Math.sin(Math.PI*t),.55))*.5;
    const L=c.p.clone().addScaledVector(W,w), R=c.p.clone().addScaledVector(W,-w);
    const M=c.p.clone().addScaledVector(O,.09);
    pos.push(L.x,L.y,L.z, M.x,M.y,M.z, R.x,R.y,R.z);
  }
  for(let i=0;i<n;i++){
    const a=i*3, b=a+3;
    idx.push(a,a+1,b, a+1,b+1,b, a+1,a+2,b+1, a+2,b+2,b+1);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setIndex(idx); geo.computeVertexNormals();
  return new THREE.Mesh(geo,mat);
}

function rod(a,b,r,mat){
  const d=b.clone().sub(a), len=d.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10),mat);
  m.position.copy(a).addScaledVector(d,.5);
  m.quaternion.setFromUnitVectors(new V3(0,1,0),d.normalize());
  return m;
}

/* ---------- ortam yansıması (stüdyo ışık kutuları) ---------- */
function makeEnvironment(renderer){
  const s=new THREE.Scene();
  const sky=new THREE.Mesh(new THREE.SphereGeometry(60,32,16),new THREE.ShaderMaterial({
    side:THREE.BackSide,
    vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'varying vec3 vP;void main(){float h=vP.y*.5+.5;vec3 c=mix(vec3(.012,.010,.009),vec3(.09,.07,.05),smoothstep(.35,1.,h));gl_FragColor=vec4(c,1.);}'
  }));
  s.add(sky);
  const box=(w,h,pos,rgb)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({side:THREE.DoubleSide}));
    m.material.color.setRGB(rgb[0],rgb[1],rgb[2]);
    m.position.set(pos[0],pos[1],pos[2]); m.lookAt(0,0,0); s.add(m);
  };
  box(26,70,[-42,18,22],[7,5.6,4]);
  box(14,70,[44,12,10],[3.2,3.6,4.4]);
  box(60,22,[0,46,0],[3.4,3,2.6]);
  box(40,50,[0,14,-46],[3.6,3,2.4]);
  box(8,60,[28,10,40],[5,4.4,3.6]);
  box(8,60,[-26,10,-38],[4.5,3.8,3]);
  box(40,6,[0,-1,44],[1.2,1,.8]);
  const pm=new THREE.PMREMGenerator(renderer);
  const rt=pm.fromScene(s,.02);
  pm.dispose();
  return rt.texture;
}

/* ---------- ana kurulum ---------- */
const canvas=$('#stage');
let renderer, scene, camera, trophy, mats=[];

async function build(){
  $('#loadMsg').textContent='Doku ve malzemeler hazırlanıyor…';
  await tick();

  renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.08;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const aniso=renderer.capabilities.getMaxAnisotropy();

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a0807);
  scene.fog=new THREE.Fog(0x0a0807,140,360);
  scene.environment=makeEnvironment(renderer);

  camera=new THREE.PerspectiveCamera(30,1,.5,900);

  // dokular
  const ct=makeCarpetTextures();
  const carpetMap=new THREE.CanvasTexture(ct.col);
  const carpetBump=new THREE.CanvasTexture(ct.bmp);
  for(const t of [carpetMap,carpetBump]){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,1.2);t.anisotropy=aniso;}
  carpetMap.encoding=THREE.sRGBEncoding;
  await tick();

  const baseTex=new THREE.CanvasTexture(makeBaseTexture());
  baseTex.encoding=THREE.sRGBEncoding; baseTex.anisotropy=aniso;
  const plainC=document.createElement('canvas'); plainC.width=plainC.height=1024;
  drawMarble(plainC.getContext('2d'),1024,1024,160);
  const plainTex=new THREE.CanvasTexture(plainC); plainTex.encoding=THREE.sRGBEncoding; plainTex.anisotropy=aniso;
  await tick();

  $('#loadMsg').textContent='Top deseni hesaplanıyor…';
  await tick();
  const ball=makeBallTexture();
  const ballTex=new THREE.CanvasTexture(ball.canvas);
  ballTex.encoding=THREE.sRGBEncoding; ballTex.anisotropy=aniso;
  await tick();

  // malzemeler
  const carpetMat=new THREE.MeshStandardMaterial({map:carpetMap,bumpMap:carpetBump,bumpScale:2.2,roughness:.95,metalness:0,side:THREE.DoubleSide});
  const goldMat=new THREE.MeshStandardMaterial({color:GOLD,metalness:1,roughness:.2,side:THREE.DoubleSide});
  const marbleSide=new THREE.MeshPhysicalMaterial({map:baseTex,roughness:.22,metalness:.1,clearcoat:1,clearcoatRoughness:.06});
  const marblePlain=new THREE.MeshPhysicalMaterial({map:plainTex,roughness:.2,metalness:.1,clearcoat:1,clearcoatRoughness:.06});
  const ballMat=new THREE.MeshStandardMaterial({map:ballTex,metalness:1,roughness:.2});
  const rimMat=new THREE.MeshStandardMaterial({color:0x8a2227,roughness:.95});
  const fringeMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.95});
  mats=[carpetMat,goldMat,marbleSide,marblePlain,ballMat,rimMat,fringeMat];

  trophy=new THREE.Group();

  // taban
  const oct=-Math.PI/8;
  const slab=new THREE.Mesh(new THREE.CylinderGeometry(7.4,7.6,1.2,8,1,false,oct),marblePlain);
  slab.position.y=.6; trophy.add(slab);
  const RT=5.6, RB=7.0, YB=1.2, YT=9.0;
  const main=new THREE.Mesh(new THREE.CylinderGeometry(RT,RB,YT-YB,8,1,false,oct),[marbleSide,marblePlain,marblePlain]);
  main.position.y=(YB+YT)/2; trophy.add(main);
  const ringB=new THREE.Mesh(new THREE.CylinderGeometry(7.12,7.2,.5,8,1,false,oct),goldMat); ringB.position.y=1.45; trophy.add(ringB);
  const ringT=new THREE.Mesh(new THREE.CylinderGeometry(5.72,5.78,.5,8,1,false,oct),goldMat); ringT.position.y=8.8; trophy.add(ringT);
  for(let k=0;k<8;k++){
    const th=oct+k*Math.PI/4;
    const a=new V3(RB*1.005*Math.sin(th),YB+.3,RB*1.005*Math.cos(th));
    const b=new V3(RT*1.005*Math.sin(th),YT-.3,RT*1.005*Math.cos(th));
    trophy.add(rod(a,b,.13,goldMat));
  }
  // altın yaka
  const collar=new THREE.Mesh(new THREE.CylinderGeometry(4.55,4.95,.85,64),goldMat); collar.position.y=9.4; trophy.add(collar);
  const collar2=new THREE.Mesh(new THREE.TorusGeometry(4.5,.16,10,64),goldMat); collar2.rotation.x=Math.PI/2; collar2.position.y=9.85; trophy.add(collar2);

  // halı gövde, kenar, saçak, altın şerit
  trophy.add(buildBody(carpetMat));
  const rimPts=[]; for(let i=0;i<120;i++) rimPts.push(bodyP(i/120*TAU,1,0));
  const rim=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rimPts,true),240,.3,10,true),rimMat);
  trophy.add(rim);

  const FN=950, fgeo=new THREE.BoxGeometry(.06,1,.06); fgeo.translate(0,.5,0);
  const fr=new THREE.InstancedMesh(fgeo,fringeMat,FN);
  const dm=new THREE.Object3D(), up=new V3(0,1,0), cc=new THREE.Color();
  for(let i=0;i<FN;i++){
    const a=i/FN*TAU+(rand()-.5)*.012, p=bodyP(a,1,.1);
    const out=new V3(Math.sin(a),0,Math.cos(a)), tg=new V3(Math.cos(a),0,-Math.sin(a));
    const dir=out.clone().addScaledVector(up,.1+rand()*.55).addScaledVector(tg,(rand()-.5)*.35).normalize();
    dm.position.copy(p); dm.quaternion.setFromUnitVectors(up,dir);
    dm.scale.set(1,1+rand()*.9,1); dm.updateMatrix();
    fr.setMatrixAt(i,dm.matrix);
    fr.setColorAt(i,cc.setHSL(.095,.38,.6+rand()*.2));
  }
  trophy.add(fr);

  trophy.add(buildRibbon(goldMat));

  // top
  const ballMesh=new THREE.Mesh(new THREE.SphereGeometry(5.5,96,64),ballMat);
  ballMesh.position.y=38.5;
  ballMesh.quaternion.setFromUnitVectors(ball.vertex,new V3(.12,.3,1).normalize());
  trophy.add(ballMesh);

  trophy.traverse(o=>{if(o.isMesh){o.castShadow=true;}});
  slab.receiveShadow=main.receiveShadow=true;
  scene.add(trophy);

  // yansıma (zemin altında ters kopya)
  const refl=trophy.clone(true);
  refl.scale.y=-1;
  refl.traverse(o=>{o.castShadow=false;o.receiveShadow=false;});
  scene.add(refl);

  // zemin
  const floor=new THREE.Mesh(new THREE.CircleGeometry(600,64),
    new THREE.MeshStandardMaterial({color:0x0b0908,roughness:.28,metalness:.6,envMapIntensity:.35,transparent:true,opacity:.9}));
  floor.rotation.x=-Math.PI/2; scene.add(floor);
  const shadowPlane=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.ShadowMaterial({opacity:.55}));
  shadowPlane.rotation.x=-Math.PI/2; shadowPlane.position.y=.03; shadowPlane.receiveShadow=true; scene.add(shadowPlane);

  // ışıklar
  const key=new THREE.DirectionalLight(0xffe2b8,1.6);
  key.position.set(34,90,52); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  Object.assign(key.shadow.camera,{left:-45,right:45,top:60,bottom:-30,near:10,far:260});
  key.shadow.bias=-.0004; key.shadow.normalBias=.06;
  key.target.position.set(0,20,0); scene.add(key,key.target);
  const rimL=new THREE.DirectionalLight(0xbcd0ff,.7); rimL.position.set(-50,40,-60); scene.add(rimL);
  const fill=new THREE.HemisphereLight(0xffe9cc,0x120d08,.35); scene.add(fill);
  const spot=new THREE.SpotLight(0xffd9a0,1.1,0,.42,1); spot.position.set(0,120,10); spot.target.position.set(0,20,0); scene.add(spot,spot.target);

  initControls();
  resize();
  window.addEventListener('resize',resize);
  requestAnimationFrame(t=>{prev=t;frame(t);});
  $('#loader').classList.add('done');
  setTimeout(()=>$('#loader').remove(),1000);
}

/* ---------- kamera ve kontroller ---------- */
const cam={az:.55,el:.2,dist:150,ty:21};
const goal={az:cam.az-2.2,el:.18,dist:100,ty:21};
let fit=1, auto=!window.matchMedia('(prefers-reduced-motion:reduce)').matches;
let dragging=false, vAz=0, lastInt=-1e9, sliderActive=false, wire=false;
let prev=0;

const VIEWS=[
  {k:'on',   t:'Ön',            az:0,            el:.10, d:100, ty:21},
  {k:'yan',  t:'Yan',           az:Math.PI/2,    el:.10, d:100, ty:21},
  {k:'arka', t:'Arka',          az:Math.PI,      el:.10, d:100, ty:21},
  {k:'ust',  t:'Üst',           az:0,            el:1.5, d:78,  ty:30},
  {k:'top',  t:'Top detayı',    az:.35,          el:.30, d:36,  ty:38.5},
  {k:'hali', t:'Halı deseni',   az:-.35,         el:.08, d:40,  ty:22},
  {k:'taban',t:'Taban detayı',  az:.28,          el:.20, d:40,  ty:6}
];

function wrapNear(target,ref){return ref+Math.atan2(Math.sin(target-ref),Math.cos(target-ref));}

function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  fit=Math.max(1,.85/camera.aspect);
  if(!initControls.set){goal.dist=100*fit;}
}

function clearViewSel(){document.querySelectorAll('#views button.on').forEach(b=>b.classList.remove('on'));}
function interact(){lastInt=performance.now();$('#hint').classList.add('gone');}
function setAuto(v){auto=v;$('#autoBtn').setAttribute('aria-pressed',v);}

function initControls(){
  initControls.set=true;
  const vb=$('#views');
  VIEWS.forEach(v=>{
    const b=document.createElement('button'); b.textContent=v.t; b.type='button';
    b.addEventListener('click',()=>{
      interact(); setAuto(false); clearViewSel(); b.classList.add('on');
      goal.az=wrapNear(v.az,cam.az); goal.el=v.el; goal.dist=Math.max(18,v.d*(v.d>60?fit:Math.min(fit,1.4))); goal.ty=v.ty; vAz=0;
    });
    vb.appendChild(b);
  });

  const pts=new Map(); let pinch=0, lx=0, ly=0, lt=0;
  canvas.addEventListener('pointerdown',e=>{
    canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    dragging=true; canvas.classList.add('drag'); lx=e.clientX; ly=e.clientY; lt=e.timeStamp; vAz=0;
    if(pts.size===2){const [a,b]=[...pts.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);}
    interact(); clearViewSel();
  });
  canvas.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size>=2){
      const [a,b]=[...pts.values()], dd=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch>0) goal.dist=clamp(goal.dist*pinch/dd,18,190*fit);
      pinch=dd; interact(); return;
    }
    const dx=e.clientX-lx, dy=e.clientY-ly, dt=Math.max(1,e.timeStamp-lt);
    lx=e.clientX; ly=e.clientY; lt=e.timeStamp;
    const dA=-dx*.0065;
    goal.az+=dA; goal.el=clamp(goal.el+dy*.005,.02,1.5);
    vAz=clamp(vAz*.5+(dA/dt*1000)*.5,-7,7);
    interact();
  });
  const end=e=>{
    pts.delete(e.pointerId); pinch=0;
    if(pts.size===0){dragging=false;canvas.classList.remove('drag'); if(e.timeStamp-lt>90)vAz=0;}
    interact();
  };
  canvas.addEventListener('pointerup',end);
  canvas.addEventListener('pointercancel',end);
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    goal.dist=clamp(goal.dist*Math.exp(e.deltaY*.0012),18,190*fit);
    interact(); clearViewSel();
  },{passive:false});
  canvas.addEventListener('keydown',e=>{
    const m={ArrowLeft:[-.2,0],ArrowRight:[.2,0],ArrowUp:[0,-.1],ArrowDown:[0,.1]}[e.key];
    if(m){e.preventDefault();goal.az+=m[0];goal.el=clamp(goal.el+m[1],.02,1.5);interact();clearViewSel();}
    if(e.key==='+'||e.key==='='){goal.dist=clamp(goal.dist*.88,18,190*fit);}
    if(e.key==='-'){goal.dist=clamp(goal.dist*1.14,18,190*fit);}
  });

  const sl=$('#angle');
  sl.addEventListener('pointerdown',()=>{sliderActive=true;});
  window.addEventListener('pointerup',()=>{sliderActive=false;});
  sl.addEventListener('input',()=>{
    interact(); clearViewSel(); vAz=0;
    goal.az=wrapNear(sl.value*Math.PI/180,cam.az);
    $('#angleOut').textContent=sl.value+'°';
  });

  $('#autoBtn').addEventListener('click',()=>{setAuto(!auto);lastInt=-1e9;});
  $('#wireBtn').addEventListener('click',e=>{
    wire=!wire; e.currentTarget.setAttribute('aria-pressed',wire);
    mats.forEach(m=>{m.wireframe=wire;m.needsUpdate=true;});
  });
}

function frame(t){
  const dt=Math.min(.05,(t-prev)/1000); prev=t;
  if(!dragging){
    goal.az+=vAz*dt; vAz*=Math.exp(-dt*3.5);
    if(auto&&t-lastInt>2500) goal.az+=.36*dt;
  }
  const k=1-Math.exp(-dt*7);
  cam.az+=(goal.az-cam.az)*k;
  cam.el+=(goal.el-cam.el)*k;
  cam.dist+=(goal.dist-cam.dist)*k;
  cam.ty+=(goal.ty-cam.ty)*k;
  const ce=Math.cos(cam.el);
  camera.position.set(cam.dist*ce*Math.sin(cam.az),cam.ty+cam.dist*Math.sin(cam.el),cam.dist*ce*Math.cos(cam.az));
  camera.lookAt(0,cam.ty,0);

  if(!sliderActive){
    const deg=((cam.az*180/Math.PI)%360+360)%360;
    const r=Math.round(deg)%360;
    const sl=$('#angle'); if(+sl.value!==r){sl.value=r;$('#angleOut').textContent=r+'°';}
  }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* ---------- başlat ---------- */
window.addEventListener('load',async()=>{
  try{ await Promise.race([document.fonts.load('500 40px Jost'),new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  try{ await build(); }
  catch(err){
    console.error(err);
    $('#loadMsg').textContent='3D model yüklenemedi. Tarayıcınız WebGL desteklemiyor olabilir veya internet bağlantısı kesik (three.js yüklenemedi).';
  }
});
})();
</script>
