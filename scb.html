<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sciblend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bordo-deep: #4A0E17;
    --bordo: #6B1420;
    --bordo-light: #8C2233;
    --cream: #FAF7F2;
    --blush: #F1E7E1;
    --tunc: #B08D57;
    --ink: #2A1013;
    --line: rgba(74,14,23,0.14);
    --shadow: 0 10px 30px rgba(74,14,23,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  img{display:block; max-width:100%;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}

  /* ===== Header ===== */
  header{
    position:sticky; top:0; z-index:40;
    background:var(--bordo-deep);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .header-inner{
    max-width:1280px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
  }
  .logo{
    display:flex; align-items:center; gap:10px;
    font-family:'Cormorant Garamond',serif;
    font-size:24px; font-weight:600; letter-spacing:2.5px;
    color:#fff;
    text-transform:lowercase;
  }
  .logo img{
    width:34px; height:34px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,0.2));
  }
  .header-actions{display:flex; align-items:center; gap:14px;}
  .icon-btn{
    position:relative; width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; transition:background .2s;
    color:#fff;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.12);}
  .badge{
    position:absolute; top:-2px; right:-2px;
    background:var(--tunc); color:var(--bordo-deep);
    font-size:10px; font-weight:700;
    width:17px; height:17px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--bordo-deep);
  }

  /* ===== Hero ===== */
  .hero{
    max-width:1280px; margin:0 auto;
    padding:64px 20px 44px;
    display:grid; grid-template-columns:1fr; gap:12px;
    border-bottom:1px solid var(--line);
  }
  .hero-eyebrow{
    font-size:12px; letter-spacing:3px; text-transform:uppercase;
    color:var(--tunc); font-weight:600; margin-bottom:6px;
  }
  .hero h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:clamp(36px, 6vw, 68px);
    line-height:1.05;
    color:var(--bordo-deep);
    max-width:14ch;
  }
  .hero h1 em{font-style:italic; color:var(--bordo);}
  .hero p{
    margin-top:14px; max-width:46ch;
    color:#6b4a4f; font-size:15.5px; line-height:1.6;
  }

  /* ===== Filter bar ===== */
  .filter-bar{
    max-width:1280px; margin:0 auto;
    padding:22px 20px 6px;
    display:flex; gap:10px; overflow-x:auto;
    scrollbar-width:none;
  }
  .filter-bar::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:9px 18px;
    border:1px solid var(--line);
    border-radius:999px;
    font-size:13px; font-weight:500;
    color:var(--bordo-deep);
    background:#fff;
    transition:all .2s;
    white-space:nowrap;
  }
  .chip.active, .chip:hover{
    background:var(--bordo-deep); color:#fff; border-color:var(--bordo-deep);
  }

  /* ===== Product grid ===== */
  .grid-section{max-width:1280px; margin:0 auto; padding:20px 20px 80px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:14px 12px;
  }
  @media (min-width:900px){
    .grid{grid-template-columns:repeat(4, 1fr); gap:26px 22px;}
  }

  .card{
    cursor:pointer;
    display:flex; flex-direction:column;
  }
  .card-img-wrap{
    position:relative;
    aspect-ratio:3/4;
    border-radius:14px;
    overflow:hidden;
    background:var(--blush);
    box-shadow:var(--shadow);
  }
  .card-img-wrap img{
    width:100%; height:100%; object-fit:cover;
    transition:transform .5s cubic-bezier(.2,.7,.2,1), opacity .4s;
  }
  .card-img-wrap img.img-b{
    position:absolute; inset:0; opacity:0;
  }
  .card:hover .img-a{opacity:0; }
  .card:hover .img-b{opacity:1; transform:scale(1.04);}
  .card:hover .img-a{transform:scale(1.04);}

  .card-tag{
    position:absolute; top:10px; left:10px;
    background:var(--bordo); color:#fff;
    font-size:10.5px; font-weight:700; letter-spacing:.5px;
    padding:4px 9px; border-radius:6px;
    text-transform:uppercase;
  }
  .card-wish{
    position:absolute; top:10px; right:10px;
    width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,0.88);
    display:flex; align-items:center; justify-content:center;
    color:var(--bordo);
    transition:transform .2s;
  }
  .card-wish:hover{transform:scale(1.1);}
  .card-wish.active svg{fill:var(--bordo);}

  .card-info{padding:10px 2px 0;}
  .card-name{
    font-size:13px; font-weight:500; color:var(--ink);
    line-height:1.35; margin-bottom:4px;
  }
  .card-price-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:7px;
  }
  .card-price{font-size:14.5px; font-weight:700; color:var(--bordo-deep);}
  .card-price .old{
    font-size:12px; font-weight:500; color:#a98a8f;
    text-decoration:line-through; margin-left:6px;
  }
  .swatches{display:flex; gap:5px; align-items:center;}
  .swatch{
    width:14px; height:14px; border-radius:50%;
    border:1.5px solid rgba(0,0,0,0.08);
  }
  .swatch-more{font-size:10.5px; color:#8a6a6f; margin-left:2px;}

  /* ===== Product Modal ===== */
  .modal-overlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(42,16,19,0.45);
    display:none; align-items:flex-end;
    backdrop-filter:blur(2px);
  }
  .modal-overlay.open{display:flex;}
  @media (min-width:768px){
    .modal-overlay{align-items:center; justify-content:center;}
  }

  .modal{
    background:var(--cream);
    width:100%; max-height:92vh;
    border-radius:22px 22px 0 0;
    overflow-y:auto;
    animation:slideUp .32s cubic-bezier(.2,.8,.2,1);
  }
  @media (min-width:768px){
    .modal{
      width:min(900px, 92vw); max-height:86vh;
      border-radius:20px;
      display:grid; grid-template-columns:1fr 1fr;
      animation:fadeScale .28s cubic-bezier(.2,.8,.2,1);
    }
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  @keyframes fadeScale{from{transform:scale(.96); opacity:0;} to{transform:scale(1); opacity:1;}}

  .modal-close{
    position:absolute; top:14px; right:14px; z-index:5;
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,0.9);
    display:flex; align-items:center; justify-content:center;
    color:var(--bordo-deep);
  }

  .modal-gallery{position:relative; background:var(--blush);}
  .modal-main-img{width:100%; aspect-ratio:3/4; object-fit:cover;}
  @media (min-width:768px){ .modal-main-img{height:100%; aspect-ratio:auto;} }
  .modal-thumbs{
    display:flex; gap:8px; padding:12px;
    overflow-x:auto;
  }
  @media (min-width:768px){
    .modal-thumbs{position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent, rgba(0,0,0,0.15));}
  }
  .modal-thumb{
    width:52px; height:66px; border-radius:8px; overflow:hidden;
    border:2px solid transparent; flex:0 0 auto; cursor:pointer;
  }
  .modal-thumb.active{border-color:var(--bordo);}
  .modal-thumb img{width:100%; height:100%; object-fit:cover;}

  .modal-body{padding:26px 22px 28px;}
  .modal-eyebrow{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--tunc); font-weight:700;}
  .modal-title{
    font-family:'Cormorant Garamond',serif; font-weight:500;
    font-size:30px; color:var(--bordo-deep); margin:6px 0 10px; line-height:1.15;
  }
  .modal-price{font-size:20px; font-weight:700; color:var(--bordo);}
  .modal-price .old{font-size:14px; color:#a98a8f; text-decoration:line-through; font-weight:500; margin-left:8px;}
  .modal-desc{margin:14px 0 20px; font-size:13.5px; line-height:1.65; color:#6b4a4f;}

  .option-block{margin-bottom:20px;}
  .option-label{
    display:flex; justify-content:space-between;
    font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:10px;
  }
  .option-label span.sel{font-weight:500; color:#8a6a6f;}
  .color-options{display:flex; gap:10px;}
  .color-opt{
    width:34px; height:34px; border-radius:50%;
    border:2px solid transparent; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .color-opt .dot{width:26px; height:26px; border-radius:50%; border:1.5px solid rgba(0,0,0,0.1);}
  .color-opt.active{border-color:var(--bordo);}

  .size-options{display:flex; gap:8px; flex-wrap:wrap;}
  .size-opt{
    min-width:42px; height:40px; padding:0 10px;
    border:1px solid var(--line); border-radius:9px;
    font-size:13px; font-weight:600; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    transition:all .15s;
  }
  .size-opt:hover{border-color:var(--bordo-light);}
  .size-opt.active{background:var(--bordo-deep); color:#fff; border-color:var(--bordo-deep);}
  .size-opt.disabled{opacity:.35; text-decoration:line-through; pointer-events:none;}

  .modal-actions{display:flex; gap:10px; margin-top:24px;}
  .btn-primary{
    flex:1; background:var(--bordo-deep); color:#fff;
    padding:15px 18px; border-radius:12px;
    font-size:14px; font-weight:700; letter-spacing:.3px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:background .2s, transform .1s;
  }
  .btn-primary:hover{background:var(--bordo);}
  .btn-primary:active{transform:scale(.98);}
  .btn-icon{
    width:52px; height:52px; border-radius:12px;
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--bordo-deep); transition:all .2s;
  }
  .btn-icon:hover{background:var(--blush);}
  .btn-icon.active{background:var(--bordo); color:#fff; border-color:var(--bordo);}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--bordo-deep); color:#fff;
    padding:13px 22px; border-radius:12px;
    font-size:13.5px; font-weight:500;
    opacity:0; pointer-events:none; transition:all .3s;
    z-index:200; box-shadow:0 8px 24px rgba(74,14,23,0.3);
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  footer{
    border-top:1px solid var(--line);
    padding:34px 20px 40px; text-align:center;
    color:#8a6a6f; font-size:12.5px;
  }
</style>
</head>

const filters = ["Hamısı","Paltar","Üst geyim","Aksesuar","Endirimdə"];

/* ===== State ===== */
let cart = [];      // {productId, color, size, qty}
let wishlist = [];  // productIds
let activeFilter = "Hamısı";
let currentProduct = null;
let selColor = null;
let selSize = null;
let activeImgIdx = 0;

/* ===== Render filter chips ===== */
const filterBar = document.getElementById('filterBar');
filters.forEach(f=>{
  const chip = document.createElement('button');
  chip.className = 'chip' + (f==='Hamısı' ? ' active' : '');
  chip.textContent = f;
  chip.onclick = () => {
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = f;
    renderGrid();
  };
  filterBar.appendChild(chip);
});

/* ===== Render grid ===== */
function renderGrid(){
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';
  let list = products;
  if(activeFilter === 'Endirimdə') list = products.filter(p=>p.oldPrice);

  list.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openModal(p.id);

    const isWished = wishlist.includes(p.id);
    const swatchLimit = 3;
    const shownColors = p.colors.slice(0, swatchLimit);
    const extra = p.colors.length - swatchLimit;

    card.innerHTML = `
      <div class="card-img-wrap">
        ${p.tag ? `<div class="card-tag">${p.tag}</div>` : ''}
        <img class="img-a" src="${p.imgs[0]}" alt="${p.name}" loading="lazy">
        ${p.imgs[1] ? `<img class="img-b" src="${p.imgs[1]}" alt="${p.name}">` : ''}
        <button class="card-wish ${isWished ? 'active':''}" data-wish="${p.id}" title="Sevimlilərə əlavə et">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="${isWished?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
        </button>
      </div>
      <div class="card-info">
        <div class="card-name">${p.name}</div>
        <div class="card-price-row">
          <div class="card-price">${p.price} ₼ ${p.oldPrice ? `<span class="old">${p.oldPrice} ₼</span>` : ''}</div>
        </div>
        <div class="swatches">
          ${shownColors.map(c=>`<span class="swatch" style="background:${COLOR_HEX[c]}"></span>`).join('')}
          ${extra > 0 ? `<span class="swatch-more">+${extra}</span>` : ''}
        </div>
      </div>
    `;
    card.querySelector('[data-wish]').onclick = (e) => {
      e.stopPropagation();
      toggleWish(p.id);
    };
    grid.appendChild(card);
  });
}

/* ===== Wishlist ===== */
function toggleWish(id){
  const i = wishlist.indexOf(id);
  if(i > -1){ wishlist.splice(i,1); }
  else { wishlist.push(id); showToast('Sevimlilərə əlavə edildi ♥'); }
  document.getElementById('wishCount').textContent = wishlist.length;
  renderGrid();
  if(currentProduct && currentProduct.id === id) updateModalWishBtn();
}

/* ===== Modal ===== */
function openModal(id){
  currentProduct = products.find(p=>p.id===id);
  selColor = currentProduct.colors[0];
  selSize = null;
  activeImgIdx = 0;
  renderModal();
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modalOverlay') closeModal();
});

function renderModal(){
  const p = currentProduct;
  const modal = document.getElementById('modal');
  const isWished = wishlist.includes(p.id);

  modal.innerHTML = `
    <button class="modal-close" id="modalCloseBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="modal-gallery">
      <img class="modal-main-img" id="modalMainImg" src="${p.imgs[activeImgIdx]}" alt="${p.name}">
      <div class="modal-thumbs" id="modalThumbs">
        ${p.imgs.map((img,i)=>`<div class="modal-thumb ${i===activeImgIdx?'active':''}" data-idx="${i}"><img src="${img}"></div>`).join('')}
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-eyebrow">${p.tag || 'sciblend'}</div>
      <div class="modal-title">${p.name}</div>
      <div class="modal-price">${p.price} ₼ ${p.oldPrice ? `<span class="old">${p.oldPrice} ₼</span>` : ''}</div>
      <p class="modal-desc">${p.desc}</p>

      <div class="option-block">
        <div class="option-label"><span>Rəng</span><span class="sel" id="colorLabel">${selColor}</span></div>
        <div class="color-options" id="colorOptions">
          ${p.colors.map(c=>`
            <div class="color-opt ${c===selColor?'active':''}" data-color="${c}" title="${c}">
              <div class="dot" style="background:${COLOR_HEX[c]}"></div>
            </div>`).join('')}
        </div>
      </div>

      <div class="option-block">
        <div class="option-label"><span>Ölçü</span><span class="sel" id="sizeLabel">${selSize ? selSize : 'Seçin'}</span></div>
        <div class="size-options" id="sizeOptions">
          ${Object.entries(p.sizes).map(([s,avail])=>`
            <div class="size-opt ${!avail?'disabled':''} ${s===selSize?'active':''}" data-size="${s}">${s}</div>
          `).join('')}
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-primary" id="addToCartBtn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M1 1h4l2.6 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
          Səbətə əlavə et
        </button>
        <button class="btn-icon ${isWished?'active':''}" id="modalWishBtn" title="Yaddaşda saxla">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="${isWished?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
        </button>
      </div>
    </div>
  `;

  document.getElementById('modalCloseBtn').onclick = closeModal;

  modal.querySelectorAll('[data-color]').forEach(el=>{
    el.onclick = () => {
      selColor = el.dataset.color;
      document.getElementById('colorLabel').textContent = selColor;
      modal.querySelectorAll('[data-color]').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
    };
  });

  modal.querySelectorAll('[data-size]:not(.disabled)').forEach(el=>{
    el.onclick = () => {
      selSize = el.dataset.size;
      document.getElementById('sizeLabel').textContent = selSize;
      modal.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
    };
  });

  modal.querySelectorAll('[data-idx]').forEach(el=>{
    el.onclick = () => {
      activeImgIdx = parseInt(el.dataset.idx);
      document.getElementById('modalMainImg').src = p.imgs[activeImgIdx];
      modal.querySelectorAll('.modal-thumb').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
    };
  });

  document.getElementById('addToCartBtn').onclick = addToCart;
  document.getElementById('modalWishBtn').onclick = () => toggleWish(p.id);
}

function updateModalWishBtn(){
  const btn = document.getElementById('modalWishBtn');
  if(!btn) return;
  const isWished = wishlist.includes(currentProduct.id);
  btn.classList.toggle('active', isWished);
  btn.querySelector('svg').setAttribute('fill', isWished ? 'currentColor' : 'none');
}

function addToCart(){
  if(!selSize){
    showToast('Zəhmət olmasa ölçü seçin');
    return;
  }
  cart.push({productId: currentProduct.id, color: selColor, size: selSize});
  document.getElementById('cartCount').textContent = cart.length;
  showToast(`${currentProduct.name} səbətə əlavə edildi`);
}

/* ===== Toast ===== */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ===== Init ===== */
renderGrid();
</script>
</body>
</html>
