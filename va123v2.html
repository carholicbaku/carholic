<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarHolicBaku</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;400;500;600;700&family=Barlow+Condensed:wght@200;300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #080808;
      --carbon: #111111;
      --dark: #1a1a1a;
      --panel: #161616;
      --border: rgba(255,255,255,0.07);
      --gold: #c9a84c;
      --gold-light: #e8c870;
      --gold-dim: rgba(201,168,76,0.15);
      --white: #f0ece3;
      --muted: rgba(240,236,227,0.45);
      --red: #c0392b;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── GRAIN OVERLAY ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9999; opacity: 0.4;
    }

    /* ── HEADER ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 24px;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(8,8,8,0.98), rgba(8,8,8,0.85));
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: var(--gold);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px; color: var(--black);
      flex-shrink: 0;
    }
    .logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--white);
    }
    .logo-text span { color: var(--gold); }

    nav { display: flex; align-items: center; gap: 6px; }
    .nav-btn {
      background: none; border: none; cursor: pointer;
      width: 40px; height: 40px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      font-size: 18px;
      transition: all 0.2s;
      position: relative;
    }
    .nav-btn:hover, .nav-btn.active {
      color: var(--gold);
      background: var(--gold-dim);
    }
    .nav-btn.active::after {
      content: '';
      position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--gold);
    }

    /* ── HERO ── */
    .hero {
      padding-top: 64px;
      min-height: 220px;
      display: flex; align-items: flex-end;
      background: linear-gradient(135deg, #0d0d0d 0%, #111 50%, #0a0a0a 100%);
      position: relative; overflow: hidden;
      padding-bottom: 32px; padding-left: 24px;
    }
    .hero::after {
      content: 'CARHOLIC';
      position: absolute; right: -20px; top: 50%; transform: translateY(-50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(80px, 18vw, 180px);
      color: rgba(255,255,255,0.018);
      letter-spacing: 10px;
      white-space: nowrap; pointer-events: none;
      line-height: 1;
    }
    .hero-stripe {
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
    }
    .hero-content { position: relative; z-index: 1; }
    .hero-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px; font-weight: 300;
      letter-spacing: 5px; text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(42px, 10vw, 72px);
      letter-spacing: 4px;
      line-height: 0.9;
      color: var(--white);
    }
    .hero-title span { color: var(--gold); }
    .hero-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px; font-weight: 200;
      letter-spacing: 6px;
      color: var(--muted);
      margin-top: 8px;
      text-transform: uppercase;
    }

    /* ── SECTION HEADER ── */
    .section-head {
      padding: 32px 24px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px; font-weight: 400;
      letter-spacing: 5px; text-transform: uppercase;
      color: var(--gold);
      display: flex; align-items: center; gap: 10px;
    }
    .section-title::before {
      content: ''; display: block;
      width: 20px; height: 1px;
      background: var(--gold);
    }
    .section-count {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px; letter-spacing: 2px;
      color: var(--muted);
    }

    /* ── SEARCH BAR ── */
    .search-wrap {
      padding: 0 24px 24px;
    }
    .search-bar {
      display: flex; align-items: center; gap: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      transition: border-color 0.2s;
    }
    .search-bar:focus-within {
      border-color: rgba(201,168,76,0.4);
    }
    .search-bar svg { color: var(--gold); flex-shrink: 0; }
    .search-bar input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--white);
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px; font-weight: 500;
      letter-spacing: 0.5px;
    }
    .search-bar input::placeholder { color: var(--muted); }

    /* ── FILTER TABS ── */
    .filters {
      padding: 0 20px 20px;
      display: flex; gap: 8px;
      overflow-x: auto; scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-tab {
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: none; cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px; font-weight: 400;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .filter-tab:hover { color: var(--white); border-color: rgba(255,255,255,0.2); }
    .filter-tab.active {
      background: var(--gold); border-color: var(--gold);
      color: var(--black); font-weight: 600;
    }

    /* ── CAR CARDS ── */
    .cars-grid {
      padding: 0 16px 120px;
      display: flex; flex-direction: column; gap: 3px;
    }

    .car-card {
      background: var(--carbon);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-color 0.25s,
                  box-shadow 0.25s;
      position: relative;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .car-card:nth-child(1) { animation-delay: 0.05s; }
    .car-card:nth-child(2) { animation-delay: 0.12s; }
    .car-card:nth-child(3) { animation-delay: 0.19s; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .car-card:active {
      transform: scale(0.98);
    }
    .car-card:hover {
      border-color: rgba(201,168,76,0.3);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,168,76,0.1);
    }

    /* Featured card */
    .car-card.featured {
      border-color: rgba(201,168,76,0.25);
    }
    .car-card.featured .img-wrap::after {
      content: 'FEATURED';
      position: absolute; top: 12px; left: 12px;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 11px; letter-spacing: 2px;
      padding: 3px 8px; border-radius: 4px;
    }

    .card-inner {
      display: flex; gap: 0;
    }

    .img-wrap {
      width: 140px; min-width: 140px;
      height: 110px;
      position: relative; overflow: hidden;
      flex-shrink: 0;
    }
    .img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      filter: brightness(0.9) contrast(1.05) saturate(0.9);
    }
    .car-card:hover .img-wrap img { transform: scale(1.06); }

    .img-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to right, transparent 60%, var(--carbon));
      pointer-events: none;
    }

    .card-body {
      flex: 1; padding: 14px 16px 14px 12px;
      display: flex; flex-direction: column; justify-content: space-between;
      min-width: 0;
    }

    .car-brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px; letter-spacing: 2px;
      color: var(--white);
      line-height: 1;
    }

    .car-meta {
      display: flex; flex-direction: column; gap: 4px;
      margin-top: 4px;
    }
    .car-location {
      font-size: 12px; font-weight: 400;
      color: var(--muted);
      display: flex; align-items: center; gap: 5px;
      letter-spacing: 0.3px;
    }
    .car-location svg { flex-shrink: 0; }

    .car-plate {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px; letter-spacing: 3px;
      color: var(--white);
      width: fit-content;
      margin-top: 6px;
    }
    .plate-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    .card-arrow {
      position: absolute; right: 14px; bottom: 14px;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 12px;
      transition: all 0.2s;
    }
    .car-card:hover .card-arrow {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-dim);
    }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      height: 76px;
      background: rgba(10,10,10,0.97);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-around;
      padding: 0 8px;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bnav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: none; cursor: pointer;
      padding: 8px 18px;
      border-radius: 12px;
      transition: all 0.2s;
      color: var(--muted);
      text-decoration: none;
    }
    .bnav-item:hover { color: var(--white); }
    .bnav-item.active { color: var(--gold); }
    .bnav-item svg { font-size: 20px; }
    .bnav-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px; font-weight: 400;
      letter-spacing: 1.5px; text-transform: uppercase;
    }
    .bnav-item.active .bnav-icon {
      background: var(--gold-dim);
      border-radius: 8px;
      padding: 4px 12px;
    }

    /* ── MODAL / DETAIL VIEW ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.9);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 201;
      background: var(--carbon);
      border-radius: 20px 20px 0 0;
      border-top: 1px solid var(--border);
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 88vh; overflow-y: auto;
    }
    .modal.open { transform: translateY(0); }

    .modal-handle {
      width: 40px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.15);
      margin: 12px auto 0;
    }

    .modal-img {
      width: 100%; height: 240px;
      object-fit: cover;
      filter: brightness(0.9) contrast(1.05);
    }

    .modal-body { padding: 20px 24px 40px; }

    .modal-brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px; letter-spacing: 4px;
      color: var(--white);
      line-height: 1;
    }
    .modal-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
      color: var(--gold); margin-top: 4px;
    }

    .modal-stats {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-top: 20px;
    }
    .stat-box {
      background: var(--dark);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .stat-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 4px;
    }
    .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; letter-spacing: 2px;
      color: var(--white);
    }

    .modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.1);
      border: none; border-radius: 50%;
      color: var(--white); font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.2); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center; padding: 60px 24px;
      display: none;
    }
    .empty-state.show { display: block; }
    .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
    .empty-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--muted);
    }

    /* ── PREVENT IMAGE DOWNLOAD ── */
    img {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      pointer-events: none;
    }
    /* cards still need pointer events for click */
    .car-card { pointer-events: all; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.2); border-radius: 2px; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a class="logo" href="#">
      <div class="logo-icon">C</div>
      <span class="logo-text">CAR<span>HOLIC</span>BAKU</span>
    </a>
    <nav>
      <button class="nav-btn" onclick="openSearch()" title="Axtar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </button>
      <button class="nav-btn" title="Profil">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-stripe"></div>
    <div class="hero-content">
      <div class="hero-label">Bakı · Azerbaijan</div>
      <div class="hero-title">CAR IS A<br><span>LIFESTYLE</span></div>
      <div class="hero-sub">Exotic Spots · Rare Plates</div>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <main>
    <!-- Search -->
    <div class="search-wrap" id="searchSection">
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Marka, yer və ya nömrə axtar..." oninput="filterCars()" />
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-tab active" onclick="setFilter('all', this)">Hamısı</button>
      <button class="filter-tab" onclick="setFilter('porsche', this)">Porsche</button>
      <button class="filter-tab" onclick="setFilter('bugatti', this)">Bugatti</button>
      <button class="filter-tab" onclick="setFilter('baki', this)">Bakı</button>
    </div>

    <!-- Section Header -->
    <div class="section-head">
      <span class="section-title">Son görüşlər</span>
      <span class="section-count" id="carCount">3 avtomobil</span>
    </div>

    <!-- Cars Grid -->
    <div class="cars-grid" id="carsGrid">

      <div class="car-card featured" data-brand="porsche" data-location="Bakı" data-plate="77-GG-911"
           onclick="openModal('Porsche', 'img/CHB911.jpg', 'Bakı', '77-GG-911', 'Porsche 911')">
        <div class="card-inner">
          <div class="img-wrap">
            <img src="img/CHB911.jpg" alt="Porsche 911" onerror="this.src='https://images.unsplash.com/photo-1544636331-e26879cd4d9b?w=400&q=80'" />
            <div class="img-overlay"></div>
          </div>
          <div class="card-body">
            <div>
              <div class="car-brand">Porsche</div>
              <div class="car-meta">
                <div class="car-location">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                  </svg>
                  Bakı
                </div>
              </div>
            </div>
            <div class="car-plate">
              <span class="plate-dot"></span>
              77-GG-911
            </div>
          </div>
        </div>
        <div class="card-arrow">›</div>
      </div>

      <div class="car-card" data-brand="bugatti" data-location="Nazar Holdings" data-plate="77-UU-777"
           onclick="openModal('Bugatti', 'img/CHB777.jpg', 'Nazar Holdings', '77-UU-777', 'Bugatti')">
        <div class="card-inner">
          <div class="img-wrap">
            <img src="img/CHB777.jpg" alt="Bugatti" onerror="this.src='https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=400&q=80'" />
            <div class="img-overlay"></div>
          </div>
          <div class="card-body">
            <div>
              <div class="car-brand">Bugatti</div>
              <div class="car-meta">
                <div class="car-location">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                  </svg>
                  Nazar Holdings
                </div>
              </div>
            </div>
            <div class="car-plate">
              <span class="plate-dot"></span>
              77-UU-777
            </div>
          </div>
        </div>
        <div class="card-arrow">›</div>
      </div>

      <div class="car-card" data-brand="porsche" data-location="Sahil Metro" data-plate="99-ZZ-200"
           onclick="openModal('Porsche', 'img/CHB911P2.jpg', 'Sahil Metro Stansiyası', '99-ZZ-200', 'Porsche')">
        <div class="card-inner">
          <div class="img-wrap">
            <img src="img/CHB911P2.jpg" alt="Porsche" onerror="this.src='https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=400&q=80'" />
            <div class="img-overlay"></div>
          </div>
          <div class="card-body">
            <div>
              <div class="car-brand">Porsche</div>
              <div class="car-meta">
                <div class="car-location">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                  </svg>
                  Sahil Metro Stansiyası
                </div>
              </div>
            </div>
            <div class="car-plate">
              <span class="plate-dot"></span>
              99-ZZ-200
            </div>
          </div>
        </div>
        <div class="card-arrow">›</div>
      </div>

    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🚗</div>
      <div class="empty-text">Nəticə tapılmadı</div>
    </div>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a class="bnav-item active" href="#">
      <div class="bnav-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </div>
      <span class="bnav-label">Ana Səhifə</span>
    </a>
    <a class="bnav-item" href="#" onclick="openSearch(); return false;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <span class="bnav-label">Axtar</span>
    </a>
    <a class="bnav-item" href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <span class="bnav-label">Profil</span>
    </a>
    <a class="bnav-item" href="https://www.facebook.com" target="_blank">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
      </svg>
      <span class="bnav-label">Facebook</span>
    </a>
  </nav>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-handle"></div>
    <img class="modal-img" id="modalImg" src="" alt="" />
    <div class="modal-body">
      <div class="modal-brand" id="modalBrand"></div>
      <div class="modal-sub" id="modalSub">Exotic Spot · Bakı</div>
      <div class="modal-stats">
        <div class="stat-box">
          <div class="stat-label">Məkan</div>
          <div class="stat-value" id="modalLocation" style="font-size:14px; font-family:'Rajdhani',sans-serif; font-weight:600;"></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Nömrə</div>
          <div class="stat-value" id="modalPlate"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let activeFilter = 'all';

    function openSearch() {
      const el = document.getElementById('searchSection');
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setTimeout(() => document.getElementById('searchInput').focus(), 400);
    }

    function setFilter(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCars();
    }

    function filterCars() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.car-card');
      let visible = 0;

      cards.forEach(card => {
        const brand = card.dataset.brand || '';
        const location = card.dataset.location || '';
        const plate = card.dataset.plate || '';
        const text = (brand + location + plate).toLowerCase();

        const matchFilter = activeFilter === 'all' || brand.includes(activeFilter) || location.toLowerCase().includes(activeFilter);
        const matchSearch = text.includes(query);

        if (matchFilter && matchSearch) {
          card.style.display = '';
          visible++;
        } else {
          card.style.display = 'none';
        }
      });

      document.getElementById('carCount').textContent = visible + ' avtomobil';
      const empty = document.getElementById('emptyState');
      empty.classList.toggle('show', visible === 0);
    }

    function openModal(brand, img, location, plate, sub) {
      document.getElementById('modalBrand').textContent = brand;
      document.getElementById('modalImg').src = img;
      document.getElementById('modalImg').onerror = function() {
        const fallbacks = {
          'Porsche': 'https://images.unsplash.com/photo-1544636331-e26879cd4d9b?w=800&q=80',
          'Bugatti': 'https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=800&q=80'
        };
        this.src = fallbacks[brand] || fallbacks['Porsche'];
      };
      document.getElementById('modalLocation').textContent = location;
      document.getElementById('modalPlate').textContent = plate;
      document.getElementById('modalSub').textContent = sub + ' · Bakı';

      document.getElementById('modalOverlay').classList.add('open');
      document.getElementById('modal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.getElementById('modal').classList.remove('open');
      document.body.style.overflow = '';
    }

    // Prevent image saving
    document.addEventListener('contextmenu', e => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });
    document.querySelectorAll('img').forEach(img => {
      img.addEventListener('dragstart', e => e.preventDefault());
    });

    // Bottom nav active state
    document.querySelectorAll('.bnav-item').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelectorAll('.bnav-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
