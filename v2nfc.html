<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b2a41">
<title>Giriş</title>
<style>
  :root {
    --bg: #f2efe8;
    --ink: #1b2a41;
    --muted: #5d6b7e;
    --card: #ffffff;
    --accent: #1f6feb;
    --ok: #1d8a5b;
    --err: #c0392b;
    --line: #d9d4c7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh; display: flex; justify-content: center;
    padding: 24px 16px 40px;
  }
  main { width: 100%; max-width: 440px; }
  h1 { font-size: 1.6rem; margin: 8px 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 1.1rem; margin: 24px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; line-height: 1.4; }
  .hidden { display: none !important; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); margin: -4px -4px 18px; }
  .tab {
    background: none; border: 0; border-bottom: 3px solid transparent;
    padding: 12px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

  label { display: block; font-size: .9rem; font-weight: 600; margin: 14px 0 6px; }
  input {
    width: 100%; font: inherit; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
  }
  input:focus-visible, button:focus-visible { outline: 3px solid rgba(31,111,235,.45); outline-offset: 1px; }

  button.primary {
    font: inherit; font-weight: 600; border: 0; border-radius: 12px;
    padding: 14px 20px; width: 100%; margin-top: 20px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.primary:disabled { opacity: .6; cursor: default; }
  button.ghost {
    font: inherit; font-weight: 500; font-size: .9rem; background: transparent;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; color: var(--ink); cursor: pointer;
  }
  button.danger { color: var(--err); border-color: #e7c2bd; }

  .msg { margin-top: 14px; font-size: .92rem; min-height: 1.2em; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }

  /* NFC bölümü */
  .nfc {
    margin-top: 20px; background: var(--ink); color: #fff;
    border-radius: 16px; padding: 20px; text-align: center;
  }
  .nfc p { margin: 0 0 14px; font-size: .95rem; min-height: 1.3em; }
  .nfc button {
    font: inherit; font-weight: 600; width: 100%; padding: 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; cursor: pointer;
  }
  .nfc button:disabled { opacity: .5; cursor: default; }
  .nfc.scanning button { background: rgba(111,177,255,.2); border-color: #6fb1ff; }
  .nfc .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6fb1ff; margin-right: 8px; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .nfc .dot { animation: none; } }

  /* Giriş yapmış ekranlar */
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
  .badge { display: inline-block; background: #e7efff; color: #1a4fb3; border-radius: 999px; padding: 3px 10px; font-size: .8rem; font-weight: 600; }
  .badge.admin { background: #ffe9c7; color: #8a5200; }
  .stat { font-size: 2rem; font-weight: 700; margin: 4px 0 0; }
  .stat-label { color: var(--muted); font-size: .9rem; }
  .user-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px 0; border-top: 1px solid var(--line);
  }
  .user-row:first-child { border-top: 0; }
  .user-row .n { font-weight: 600; }
  .user-row .d { color: var(--muted); font-size: .82rem; }
  .empty { color: var(--muted); text-align: center; padding: 14px 0; font-size: .95rem; }
</style>
</head>
<body>
<main>

  <!-- GİRİŞ / KAYIT -->
  <section id="viewAuth">
    <h1>Hoş geldin</h1>
    <p class="sub">Hesabınla giriş yap ya da yeni hesap oluştur.</p>

    <div class="panel">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabLogin" aria-selected="true" type="button">Giriş yap</button>
        <button class="tab" role="tab" id="tabRegister" aria-selected="false" type="button">Kayıt ol</button>
      </div>

      <div id="formLogin">
        <label for="loginName">Kullanıcı adı</label>
        <input id="loginName" autocomplete="username" autocapitalize="none">
        <label for="loginPass">Şifre</label>
        <input id="loginPass" type="password" autocomplete="current-password">
        <button class="primary" id="btnLogin" type="button">Giriş yap</button>
      </div>

      <div id="formRegister" class="hidden">
        <label for="regName">Kullanıcı adı</label>
        <input id="regName" autocomplete="username" autocapitalize="none">
        <label for="regPass">Şifre (en az 6 karakter)</label>
        <input id="regPass" type="password" autocomplete="new-password">
        <label for="regPass2">Şifre tekrar</label>
        <input id="regPass2" type="password" autocomplete="new-password">
        <button class="primary" id="btnRegister" type="button">Hesap oluştur</button>
      </div>

      <div class="msg" id="authMsg" role="status"></div>
    </div>

    <div class="nfc" id="nfcBox">
      <p id="nfcStatus">Admin misin? Kartınla giriş yap.</p>
      <button id="btnNfc" type="button">Okut</button>
    </div>
  </section>

  <!-- KULLANICI SAYFASI -->
  <section id="viewUser" class="hidden">
    <div class="bar">
      <span class="badge">Kullanıcı</span>
      <button class="ghost" id="logoutUser" type="button">Çıkış yap</button>
    </div>
    <h1 id="userTitle"></h1>
    <p class="sub">Hesabına giriş yaptın.</p>
  </section>

  <!-- ADMİN SAYFASI -->
  <section id="viewAdmin" class="hidden">
    <div class="bar">
      <span class="badge admin">Admin</span>
      <button class="ghost" id="logoutAdmin" type="button">Çıkış yap</button>
    </div>
    <h1 id="adminTitle"></h1>
    <p class="sub">Kartın doğrulandı. Admin paneline hoş geldin.</p>

    <div class="panel">
      <div class="stat" id="userCount">0</div>
      <div class="stat-label">kayıtlı kullanıcı</div>
    </div>

    <h2>Kullanıcılar</h2>
    <div class="panel" id="userList"></div>
  </section>

</main>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);

  /* ------------------------------------------------------------------
     ADMİN LİSTESİ
     Kimlik anahtarları düz yazı olarak değil SHA-256 özeti olarak tutulur.
     Böylece sayfa kaynağına bakan biri anahtarı doğrudan göremez.
     ------------------------------------------------------------------ */
  const ADMINS = [
    { name: "Aa", idHash: "cc82a01a2a5c5a872d15443eeb7bbd25669ae0b31e498e5d5aeebb6cb77b6578" },
    { name: "Bb", idHash: "94f56cbe44757278fe37b66f564788fe15cb89a7216d86daaa27412fa4e4b26c" }
  ];

  /* ---------- Yardımcılar ---------- */
  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  function randomSalt() {
    const a = new Uint8Array(16); crypto.getRandomValues(a);
    return Array.from(a).map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ---------- "Veri tabanı" (tarayıcı localStorage) ---------- */
  const DB_KEY = "users_v1";
  const SESSION_KEY = "session_v1";
  const db = {
    all() { try { return JSON.parse(localStorage.getItem(DB_KEY)) || []; } catch (e) { return []; } },
    save(list) { localStorage.setItem(DB_KEY, JSON.stringify(list)); }
  };

  /* ---------- Ekran yönetimi ---------- */
  const views = { auth: $("viewAuth"), user: $("viewUser"), admin: $("viewAdmin") };
  function show(name) {
    Object.keys(views).forEach((k) => views[k].classList.toggle("hidden", k !== name));
  }
  function setMsg(text, type) {
    const m = $("authMsg"); m.textContent = text || ""; m.className = "msg" + (type ? " " + type : "");
  }

  function openSession(session) {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
    render();
  }
  function closeSession() {
    sessionStorage.removeItem(SESSION_KEY);
    stopNfc();
    render();
  }

  function renderAdmin(name) {
    $("adminTitle").textContent = "Merhaba, " + name;
    const users = db.all();
    $("userCount").textContent = users.length;
    const box = $("userList");
    if (!users.length) { box.innerHTML = '<div class="empty">Henüz kayıtlı kullanıcı yok.</div>'; return; }
    box.innerHTML = users.map((u) =>
      '<div class="user-row"><div><div class="n">' + esc(u.name) + '</div><div class="d">' +
      new Date(u.created).toLocaleString("tr-TR") + '</div></div>' +
      '<button class="ghost danger" data-del="' + esc(u.nameKey) + '" type="button">Sil</button></div>'
    ).join("");
  }

  function render() {
    let s = null;
    try { s = JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch (e) {}
    if (s && s.role === "admin") { renderAdmin(s.name); show("admin"); }
    else if (s && s.role === "user") { $("userTitle").textContent = "Merhaba, " + s.name; show("user"); }
    else { show("auth"); }
  }

  /* ---------- Sekmeler ---------- */
  function selectTab(which) {
    const login = which === "login";
    $("tabLogin").setAttribute("aria-selected", login);
    $("tabRegister").setAttribute("aria-selected", !login);
    $("formLogin").classList.toggle("hidden", !login);
    $("formRegister").classList.toggle("hidden", login);
    setMsg("");
  }
  $("tabLogin").onclick = () => selectTab("login");
  $("tabRegister").onclick = () => selectTab("register");

  /* ---------- Kayıt ---------- */
  $("btnRegister").onclick = async () => {
    const name = $("regName").value.trim();
    const p1 = $("regPass").value, p2 = $("regPass2").value;
    if (name.length < 3) return setMsg("Kullanıcı adı en az 3 karakter olmalı.", "err");
    if (p1.length < 6) return setMsg("Şifre en az 6 karakter olmalı.", "err");
    if (p1 !== p2) return setMsg("Şifreler aynı değil.", "err");

    const nameKey = name.toLowerCase();
    if (ADMINS.some((a) => a.name.toLowerCase() === nameKey)) return setMsg("Bu kullanıcı adı alınamaz.", "err");
    const users = db.all();
    if (users.some((u) => u.nameKey === nameKey)) return setMsg("Bu kullanıcı adı zaten kayıtlı.", "err");

    const salt = randomSalt();
    users.push({ name, nameKey, salt, hash: await sha256(salt + p1), created: Date.now() });
    db.save(users);
    $("regPass").value = $("regPass2").value = "";
    selectTab("login");
    $("loginName").value = name;
    setMsg("Hesabın oluşturuldu. Şimdi giriş yapabilirsin.", "ok");
  };

  /* ---------- Giriş ---------- */
  $("btnLogin").onclick = async () => {
    const name = $("loginName").value.trim();
    const pass = $("loginPass").value;
    if (!name || !pass) return setMsg("Kullanıcı adı ve şifreyi yaz.", "err");
    const user = db.all().find((u) => u.nameKey === name.toLowerCase());
    if (!user || (await sha256(user.salt + pass)) !== user.hash) {
      return setMsg("Kullanıcı adı veya şifre yanlış.", "err");
    }
    $("loginPass").value = "";
    setMsg("");
    openSession({ role: "user", name: user.name });
  };
  ["loginName", "loginPass"].forEach((id) => $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") $("btnLogin").click(); }));

  /* ---------- Çıkış / kullanıcı silme ---------- */
  $("logoutUser").onclick = closeSession;
  $("logoutAdmin").onclick = closeSession;
  $("userList").addEventListener("click", (e) => {
    const key = e.target.getAttribute && e.target.getAttribute("data-del");
    if (!key) return;
    if (!confirm("Bu kullanıcı silinsin mi?")) return;
    db.save(db.all().filter((u) => u.nameKey !== key));
    const s = JSON.parse(sessionStorage.getItem(SESSION_KEY));
    renderAdmin(s.name);
  });

  /* ---------- NFC ile admin girişi ---------- */
  const nfcBox = $("nfcBox"), nfcStatus = $("nfcStatus"), btnNfc = $("btnNfc");
  let controller = null, scanning = false;

  if (!("NDEFReader" in window) || !window.isSecureContext) {
    btnNfc.disabled = true;
    nfcStatus.textContent = !window.isSecureContext
      ? "NFC için HTTPS gerekli."
      : "NFC sadece Android Chrome'da çalışır.";
  }

  function decodeRecord(rec) {
    try { return new TextDecoder(rec.encoding || "utf-8").decode(rec.data); } catch (e) { return ""; }
  }

  // Karttaki metinlerden 12 haneli harf/rakam anahtarlarını çıkarır
  function extractKeys(records) {
    const keys = new Set();
    records.forEach((r) => {
      const text = decodeRecord(r);
      (text.match(/(?<![A-Za-z0-9])[A-Za-z0-9]{12}(?![A-Za-z0-9])/g) || []).forEach((k) => keys.add(k));
    });
    return Array.from(keys);
  }

  async function findAdmin(keys) {
    for (const k of keys) {
      const h = await sha256(k);
      const admin = ADMINS.find((a) => a.idHash === h);
      if (admin) return admin;
    }
    return null;
  }

  async function startNfc() {
    if (scanning) return stopNfc("Okuma durduruldu.");
    try {
      const ndef = new NDEFReader();
      controller = new AbortController();

      ndef.onreadingerror = () => { nfcStatus.textContent = "Kart okunamadı. Tekrar yaklaştır."; };
      ndef.onreading = async (ev) => {
        const keys = extractKeys(Array.from(ev.message.records));
        if (!keys.length) { nfcStatus.textContent = "Kartta 12 haneli kimlik anahtarı bulunamadı."; return; }
        const admin = await findAdmin(keys);
        if (!admin) { nfcStatus.textContent = "Bu kart herhangi bir admine ait değil."; return; }
        if (navigator.vibrate) navigator.vibrate(80);
        stopNfc("");
        openSession({ role: "admin", name: admin.name });
      };

      await ndef.scan({ signal: controller.signal });
      scanning = true;
      nfcBox.classList.add("scanning");
      btnNfc.textContent = "Vazgeç";
      nfcStatus.innerHTML = '<span class="dot"></span>Kartı telefonun arkasına yaklaştır…';
    } catch (err) {
      scanning = false;
      nfcBox.classList.remove("scanning");
      btnNfc.textContent = "Okut";
      if (err.name === "NotAllowedError") nfcStatus.textContent = "NFC izni verilmedi.";
      else if (err.name === "NotSupportedError") nfcStatus.textContent = "NFC kapalı. Telefon ayarlarından aç.";
      else nfcStatus.textContent = "Hata: " + err.message;
    }
  }

  function stopNfc(message) {
    if (controller) controller.abort();
    controller = null; scanning = false;
    nfcBox.classList.remove("scanning");
    btnNfc.textContent = "Okut";
    if (typeof message === "string") nfcStatus.textContent = message || "Admin misin? Kartınla giriş yap.";
  }

  btnNfc.onclick = startNfc;

  render();
})();
</script>
</body>
</html>
