<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TƏSGƏ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root{
    --red:#ff2e2e;
    --blue:#3db8ff;
    --ink:#14223a;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    font-family:'Unbounded',system-ui,sans-serif;
    overflow:hidden;
  }
  main{
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(14px,3vh,28px);
    padding:24px;text-align:center;
  }

  /* Logo */
  .logo-wrap{position:relative;width:clamp(120px,26vmin,220px);aspect-ratio:1}
  .logo{
    width:100%;height:100%;display:block;
    animation:drop .9s cubic-bezier(.2,1.4,.4,1) both, float 3.2s ease-in-out .9s infinite;
    transform-origin:50% 100%;
  }
  .shadow{
    position:absolute;left:50%;bottom:-6%;
    width:46%;height:8%;border-radius:50%;
    background:radial-gradient(closest-side,rgba(20,34,58,.28),transparent);
    transform:translateX(-50%);
    animation:shadow 3.2s ease-in-out .9s infinite;
  }
  @keyframes drop{
    0%{opacity:0;transform:translateY(-60px) scale(.9)}
    60%{opacity:1}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
  }
  @keyframes shadow{
    0%,100%{transform:translateX(-50%) scale(1);opacity:.9}
    50%{transform:translateX(-50%) scale(.7);opacity:.5}
  }

  /* Title */
  h1{
    display:flex;gap:.04em;
    font-weight:800;
    font-size:clamp(40px,12vw,96px);
    letter-spacing:.02em;line-height:1;
  }
  h1 span{
    display:inline-block;
    opacity:0;
    animation:
      rise .7s cubic-bezier(.2,1.3,.4,1) forwards,
      wave 2.4s ease-in-out infinite;
    animation-delay:calc(1s + var(--i)*.12s), calc(2.2s + var(--i)*.12s);
  }
  h1 span:nth-child(odd){color:var(--red)}
  h1 span:nth-child(even){color:var(--blue)}
  @keyframes rise{
    from{opacity:0;transform:translateY(40px) rotate(-8deg)}
    to{opacity:1;transform:translateY(0) rotate(0)}
  }
  @keyframes wave{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }

  /* Subtitle */
  .soon{
    font-weight:600;
    font-size:clamp(14px,3.6vw,24px);
    letter-spacing:.28em;
    color:var(--ink);
    opacity:0;
    animation:fade .8s ease 2s forwards;
  }
  .soon i{font-style:normal;display:inline-block;animation:blink 1.4s infinite}
  .soon i:nth-of-type(2){animation-delay:.2s}
  .soon i:nth-of-type(3){animation-delay:.4s}
  @keyframes fade{to{opacity:1}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important}
  }
</style>
</head>
